name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Backend, Unit & Release Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql, zip
          tools: composer

      - name: Install Node dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer --working-dir=server install --no-interaction --prefer-dist --optimize-autoloader

      - name: Check formatting (Prettier & PHPCS)
        run: npm run format:check

      - name: Run linters (ESLint & PHPCS)
        run: npm run lint

      - name: Check PHP syntax
        run: npm run lint:php:syntax

      - name: Run PHPUnit backend test suite
        run: npm run test:server

      - name: Run Playwright unit tests
        run: npm run test:unit

      - name: Build UI & Verify TypeScript
        run: npm run build

      - name: Compile translation catalogs
        run: npm run i18n:compile

      - name: Build release package
        run: npm run release:build

  e2e:
    name: End-to-End Test Matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality-gate

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Configure local DNS for PeakURL
        run: |
          echo "127.0.0.1 peakurl.dev api.peakurl.dev peakurl.test" | sudo tee -a /etc/hosts

      - name: Start Docker Stack
        run: |
          docker compose up -d --build
          timeout 180s bash -c 'until docker compose ps | grep -q "peakurl-server.*(healthy)" && docker compose ps | grep -q "peakurl-client.*(healthy)"; do sleep 3; done' || true
          docker compose ps

      - name: Run Auth Smoke Tests
        run: npm run smoke:auth

      - name: Run Playwright E2E Tests
        run: npm run test:e2e
