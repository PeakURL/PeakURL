      <circle cx="268" cy="111" r="6"/>
      <path class="emphasis" d="m248 134-26 36m16-23 10 7m-17 3 10 7"/>
    </g>
    <path class="spark-a" d="M84 71h18m-9-9v18" opacity=".5"/>
    <path class="spark-b" d="M267 189h18m-9-9v18" opacity=".5"/>
  </g>
</svg>
