<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" fill="none" color="#126e68">
  <style>@media(prefers-color-scheme:dark){svg{color:#83dccc}}.wash{fill:currentColor;fill-opacity:.08}.solid{fill:currentColor;fill-opacity:.2}.emphasis{stroke-width:4}@media(prefers-reduced-motion:no-preference){.halo{transform-box:fill-box;transform-origin:center;animation:halo-breathe 4.4s ease-in-out infinite}.mail-group{transform-box:fill-box;transform-origin:center;animation:mail-float 3.4s ease-in-out infinite}.key-group{transform-box:fill-box;transform-origin:center;animation:key-float 3s ease-in-out infinite}.spark-a,.spark-b{transform-box:fill-box;transform-origin:center;animation:spark-twinkle 2.6s ease-in-out infinite}.spark-b{animation-delay:1.2s}@keyframes halo-breathe{0%,100%{transform:scale(.93);fill-opacity:.025}50%{transform:scale(1.06);fill-opacity:.065}}@keyframes mail-float{0%,100%{transform:translateY(1px)}50%{transform:translateY(-3px)}}@keyframes key-float{0%,100%{transform:translateY(2px) rotate(-5deg)}50%{transform:translateY(-7px) rotate(5deg)}}@keyframes spark-twinkle{0%,100%{transform:scale(.7) rotate(0deg);opacity:.25}50%{transform:scale(1.2) rotate(45deg);opacity:.95}}}</style>
  <circle class="halo" cx="180" cy="140" r="108" fill="currentColor" fill-opacity=".025"/>
