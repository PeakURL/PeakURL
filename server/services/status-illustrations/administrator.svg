    </g>
    <path d="M178 123h92m-92 18h57m-57 18h39" opacity=".65"/>
    <g class="shield-badge">
      <path class="solid" d="m261 151 25 10v19c0 17-15 29-25 34-10-5-25-17-25-34v-19z"/>
      <path d="m250 181 8 8 15-17" stroke-width="3.4"/>
    </g>
    <path class="spark-a" d="M31 113v10m-5-5h10" opacity=".5"/>
    <path class="spark-b" d="M322 148v10m-5-5h10" opacity=".5"/>
  </g>
</svg>
