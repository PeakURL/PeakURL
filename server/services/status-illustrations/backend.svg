  <style>@media(prefers-color-scheme:dark){svg{color:#83dccc}}.wash{fill:currentColor;fill-opacity:.08}.solid{fill:currentColor;fill-opacity:.2}.emphasis{stroke-width:4}@media(prefers-reduced-motion:no-preference){.halo{transform-box:fill-box;transform-origin:center;animation:halo-breathe 4.4s ease-in-out infinite}.signal-wire{animation:wire-flow 2s linear infinite}.plug-group{transform-box:fill-box;transform-origin:center;animation:plug-nudge 2.8s ease-in-out infinite}.node-a,.node-b{transform-box:fill-box;transform-origin:center;animation:node-blink 2.2s ease-in-out infinite}.node-b{animation-delay:1.1s}@keyframes halo-breathe{0%,100%{transform:scale(.93);fill-opacity:.025}50%{transform:scale(1.06);fill-opacity:.065}}@keyframes wire-flow{to{stroke-dashoffset:-22}}@keyframes plug-nudge{0%,100%{transform:translateX(-2px)}50%{transform:translateX(4px)}}@keyframes node-blink{0%,100%{transform:scale(.9);opacity:.35}50%{transform:scale(1.45);opacity:1}}}</style>
