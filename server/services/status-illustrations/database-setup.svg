      <path d="m260 153 8 8 16-17" stroke-width="3.4"/>
    </g>
    <path class="spark-a" d="M190 48v12m-6-6h12" opacity=".5"/>
    <path class="spark-b" d="M32 175v10m-5-5h10" opacity=".5"/>
  </g>
</svg>
