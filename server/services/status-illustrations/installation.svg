<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" fill="none" color="#126e68">
  <style>@media(prefers-color-scheme:dark){svg{color:#83dccc}}.wash{fill:currentColor;fill-opacity:.08}.solid{fill:currentColor;fill-opacity:.2}@media(prefers-reduced-motion:no-preference){.halo{transform-box:fill-box;transform-origin:center;animation:halo-breathe 4.4s ease-in-out infinite}.brand-card{transform-box:fill-box;transform-origin:center;animation:card-float 3.2s ease-in-out infinite}.check-badge{transform-box:fill-box;transform-origin:center;animation:badge-pop 2.8s ease-in-out infinite}.spark-a,.spark-b{transform-box:fill-box;transform-origin:center;animation:spark-twinkle 2.6s ease-in-out infinite}.spark-b{animation-delay:1.2s}@keyframes halo-breathe{0%,100%{transform:scale(.93);fill-opacity:.025}50%{transform:scale(1.06);fill-opacity:.065}}@keyframes card-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes badge-pop{0%,100%{transform:scale(.96)}50%{transform:scale(1.08)}}@keyframes spark-twinkle{0%,100%{transform:scale(.7) rotate(0deg);opacity:.25}50%{transform:scale(1.2) rotate(45deg);opacity:.95}}}</style>
  <circle class="halo" cx="180" cy="140" r="108" fill="currentColor" fill-opacity=".025"/>
  <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <rect class="wash" x="48" y="54" width="264" height="174" rx="18"/>
    <path d="M48 86h264"/><path d="M66 70h1m10 0h1m10 0h1"/>
    <g class="brand-card">
