      <path d="m94 146 13-13m-16 6-3 3a9 9 0 0 0 13 13l4-4m-6-17 4-4a9 9 0 0 1 13 13l-3 3"/>
    </g>
    <path d="M152 130h66m-66 16h42m-42 16h54" opacity=".65"/>
    <g class="check-badge">
      <circle class="solid" cx="264" cy="142" r="20"/>
      <path d="m254 142 7 7 13-14" stroke-width="3.4"/>
    </g>
    <path d="M72 202h216" opacity=".4"/>
    <path class="spark-a" d="M300 32v10m-5-5h10" opacity=".5"/>
    <path class="spark-b" d="M28 192v10m-5-5h10" opacity=".5"/>
  </g>
</svg>
