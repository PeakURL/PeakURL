<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" fill="none" color="#126e68">
  <style>@media(prefers-color-scheme:dark){svg{color:#83dccc}}.wash{fill:currentColor;fill-opacity:.08}.solid{fill:currentColor;fill-opacity:.2}.emphasis{stroke-width:4}@media(prefers-reduced-motion:no-preference){.halo{transform-box:fill-box;transform-origin:center;animation:halo-breathe 4.4s ease-in-out infinite}.wrench{transform-box:fill-box;transform-origin:center;animation:wrench-turn 3s ease-in-out infinite}.spark{transform-box:fill-box;transform-origin:center;animation:spark-twinkle 2.6s ease-in-out infinite}@keyframes halo-breathe{0%,100%{transform:scale(.93);fill-opacity:.025}50%{transform:scale(1.06);fill-opacity:.065}}@keyframes wrench-turn{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(8deg)}}@keyframes spark-twinkle{0%,100%{transform:scale(.7) rotate(0deg);opacity:.3}50%{transform:scale(1.2) rotate(45deg);opacity:.95}}}</style>
