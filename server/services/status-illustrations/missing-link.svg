<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" fill="none" color="#126e68">
  <style>@media(prefers-color-scheme:dark){svg{color:#83dccc}}.wash{fill:currentColor;fill-opacity:.08}.solid{fill:currentColor;fill-opacity:.2}.emphasis{stroke-width:4}@media(prefers-reduced-motion:no-preference){.halo{transform-box:fill-box;transform-origin:center;animation:halo-breathe 4.4s ease-in-out infinite}.trace{animation:dash-flow 2.4s linear infinite}.link-center{transform-box:fill-box;transform-origin:center;animation:link-float 3.2s ease-in-out infinite}.error-chip{transform-box:fill-box;transform-origin:center;animation:chip-pulse 2.6s ease-in-out infinite}@keyframes halo-breathe{0%,100%{transform:scale(.93);fill-opacity:.025}50%{transform:scale(1.06);fill-opacity:.065}}@keyframes dash-flow{to{stroke-dashoffset:-24}}@keyframes link-float{0%,100%{transform:translateY(1px)}50%{transform:translateY(-4px)}}@keyframes chip-pulse{0%,100%{transform:scale(.96)}50%{transform:scale(1.06)}}}</style>
  <circle class="halo" cx="180" cy="140" r="108" fill="currentColor" fill-opacity=".025"/>
