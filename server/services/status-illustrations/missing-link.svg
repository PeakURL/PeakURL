      <path class="emphasis" d="m174 123 8-8a16 16 0 0 1 23 23l-8 8m-11 11-8 8a16 16 0 0 1-23-23l8-8m13 10 8-8m-25-22-7-7m51 59 7 7"/>
    </g>
  </g>
</svg>
