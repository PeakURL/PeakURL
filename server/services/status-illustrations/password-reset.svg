<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" fill="none" color="#126e68">
  <style>@media(prefers-color-scheme:dark){svg{color:#83dccc}}.wash{fill:currentColor;fill-opacity:.08}.solid{fill:currentColor;fill-opacity:.2}.emphasis{stroke-width:4}@media(prefers-reduced-motion:no-preference){.halo{transform-box:fill-box;transform-origin:center;animation:halo-breathe 4.4s ease-in-out infinite}.reset-arc{transform-box:fill-box;transform-origin:center;animation:arc-rock 3.2s ease-in-out infinite}.lock-group{transform-box:fill-box;transform-origin:center;animation:lock-lift 3.2s ease-in-out infinite}.dot-1,.dot-2,.dot-3,.dot-4{transform-box:fill-box;transform-origin:center;animation:dot-pulse 2s ease-in-out infinite}.dot-2{animation-delay:.22s}.dot-3{animation-delay:.44s}.dot-4{animation-delay:.66s}@keyframes halo-breathe{0%,100%{transform:scale(.93);fill-opacity:.025}50%{transform:scale(1.06);fill-opacity:.065}}@keyframes arc-rock{0%,100%{transform:rotate(0deg) scale(1)}50%{transform:rotate(-24deg) scale(1.04)}}@keyframes lock-lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-3.5px)}}@keyframes dot-pulse{0%,100%{transform:scale(.9);fill-opacity:.18}45%{transform:scale(1.5);fill-opacity:.75}}}</style>
