  <style>@media(prefers-color-scheme:dark){svg{color:#83dccc}}.wash{fill:currentColor;fill-opacity:.08}.solid{fill:currentColor;fill-opacity:.2}.emphasis{stroke-width:4}@media(prefers-reduced-motion:no-preference){.halo{transform-box:fill-box;transform-origin:center;animation:halo-breathe 4.4s ease-in-out infinite}.key-group{transform-box:fill-box;transform-origin:center;animation:key-float 3s ease-in-out infinite}.spark{transform-box:fill-box;transform-origin:center;animation:spark-twinkle 2.6s ease-in-out infinite}@keyframes halo-breathe{0%,100%{transform:scale(.93);fill-opacity:.025}50%{transform:scale(1.06);fill-opacity:.065}}@keyframes key-float{0%,100%{transform:translateY(2px) rotate(-5deg)}50%{transform:translateY(-6px) rotate(5deg)}}@keyframes spark-twinkle{0%,100%{transform:scale(.7) rotate(0deg);opacity:.3}50%{transform:scale(1.2) rotate(45deg);opacity:.95}}}</style>
  <circle class="halo" cx="180" cy="140" r="108" fill="currentColor" fill-opacity=".025"/>
  <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
