<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" fill="none" color="#126e68">
  <style>@media(prefers-color-scheme:dark){svg{color:#83dccc}}.wash{fill:currentColor;fill-opacity:.08}.solid{fill:currentColor;fill-opacity:.2}.emphasis{stroke-width:4}@media(prefers-reduced-motion:no-preference){.halo{transform-box:fill-box;transform-origin:center;animation:halo-breathe 4.4s ease-in-out infinite}.sand-flow{animation:sand-drop 1.4s linear infinite}.sand-fill{animation:sand-pulse 2.8s ease-in-out infinite}.speed-left{animation:speed-shift-l 2.4s ease-in-out infinite}.speed-right{animation:speed-shift-r 2.4s ease-in-out infinite}@keyframes halo-breathe{0%,100%{transform:scale(.93);fill-opacity:.025}50%{transform:scale(1.06);fill-opacity:.065}}@keyframes sand-drop{to{stroke-dashoffset:-16}}@keyframes sand-pulse{0%,100%{fill-opacity:.14}50%{fill-opacity:.32}}@keyframes speed-shift-l{0%,100%{transform:translateX(0);opacity:.4}50%{transform:translateX(-4px);opacity:.9}}@keyframes speed-shift-r{0%,100%{transform:translateX(0);opacity:.4}50%{transform:translateX(4px);opacity:.9}}}</style>
