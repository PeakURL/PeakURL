<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" fill="none" color="#126e68">
  <defs>
    <path id="warning" d="m253 147 48 81a8 8 0 0 1-7 12h-96a8 8 0 0 1-7-12l48-81a8 8 0 0 1 14 0z"/>
    <mask id="foreground-clearance" maskUnits="userSpaceOnUse" x="0" y="0" width="360" height="280">
      <rect width="360" height="280" fill="white"/>
      <use href="#warning" fill="black" stroke="black" stroke-width="8" stroke-linejoin="round"/>
    </mask>
  </defs>
  <style>@media(prefers-color-scheme:dark){svg{color:#83dccc}}.wash{fill:currentColor;fill-opacity:.08}.solid{fill:currentColor;fill-opacity:.2}.emphasis{stroke-width:4}@media(prefers-reduced-motion:no-preference){.halo{transform-box:fill-box;transform-origin:center;animation:halo-breathe 4.4s ease-in-out infinite}.warn-group{transform-box:fill-box;transform-origin:center;animation:warn-pulse 2.8s ease-in-out infinite}.node-a,.node-b{transform-box:fill-box;transform-origin:center;animation:node-blink 2s ease-in-out infinite}.node-b{animation-delay:1s}@keyframes halo-breathe{0%,100%{transform:scale(.93);fill-opacity:.025}50%{transform:scale(1.06);fill-opacity:.065}}@keyframes warn-pulse{0%,100%{transform:translateY(0) scale(.98)}50%{transform:translateY(-4px) scale(1.04)}}@keyframes node-blink{0%,100%{transform:scale(.9);opacity:.35}50%{transform:scale(1.45);opacity:1}}}</style>
  <circle class="halo" cx="180" cy="140" r="108" fill="currentColor" fill-opacity=".025"/>
  <g stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <g mask="url(#foreground-clearance)">
      <rect class="wash" x="70" y="61" width="214" height="65" rx="17"/>
      <rect class="wash" x="70" y="146" width="214" height="65" rx="17"/>
      <circle class="node-a" cx="96" cy="93" r="4"/>
