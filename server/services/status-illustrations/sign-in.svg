<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" fill="none" color="#126e68">
  <style>@media(prefers-color-scheme:dark){svg{color:#83dccc}}.wash{fill:currentColor;fill-opacity:.08}.solid{fill:currentColor;fill-opacity:.2}.emphasis{stroke-width:4}@media(prefers-reduced-motion:no-preference){.halo{transform-box:fill-box;transform-origin:center;animation:halo-breathe 4.4s ease-in-out infinite}.user-group{transform-box:fill-box;transform-origin:center;animation:user-float 3.2s ease-in-out infinite}.arrow{animation:sign-in-arrow 2.4s cubic-bezier(.4,0,.2,1) infinite}.door{animation:door-glow 2.4s cubic-bezier(.4,0,.2,1) infinite}@keyframes halo-breathe{0%,100%{transform:scale(.93);fill-opacity:.025}50%{transform:scale(1.06);fill-opacity:.065}}@keyframes user-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes sign-in-arrow{0%,100%{transform:translateX(-1px)}50%{transform:translateX(10px)}}@keyframes door-glow{0%,100%{fill-opacity:.07}50%{fill-opacity:.24}}}</style>
