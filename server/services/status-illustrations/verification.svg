<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" fill="none" color="#126e68">
  <style>@media(prefers-color-scheme:dark){svg{color:#83dccc}}.wash{fill:currentColor;fill-opacity:.08}.solid{fill:currentColor;fill-opacity:.2}.emphasis{stroke-width:4}@media(prefers-reduced-motion:no-preference){.halo{transform-box:fill-box;transform-origin:center;animation:halo-breathe 4.4s ease-in-out infinite}.shield-group{transform-box:fill-box;transform-origin:center;animation:shield-float 2.8s ease-in-out infinite}.check-mark{transform-box:fill-box;transform-origin:center;animation:check-pop 2.8s ease-in-out infinite}.spark{transform-box:fill-box;transform-origin:center;animation:spark-twinkle 2.6s ease-in-out infinite}@keyframes halo-breathe{0%,100%{transform:scale(.93);fill-opacity:.025}50%{transform:scale(1.06);fill-opacity:.065}}@keyframes shield-float{0%,100%{transform:translateY(1px) scale(.99)}50%{transform:translateY(-6px) scale(1.03)}}@keyframes check-pop{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}@keyframes spark-twinkle{0%,100%{transform:scale(.7) rotate(0deg);opacity:.3}50%{transform:scale(1.25) rotate(45deg);opacity:1}}}</style>
